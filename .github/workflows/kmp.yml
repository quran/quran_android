name: Quran KMP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'redesign/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: KMP Android and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared behavior and build Android
        run: ./gradlew :core:model:jvmTest :core:domain:jvmTest :core:data:jvmTest :core:designsystem:jvmTest :feature:memorization:jvmTest :feature:translations:jvmTest :feature:downloads:jvmTest :androidApp:assembleDebug :androidApp:lintDebug --stacktrace
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: |
            multiplatform/core/**/build/reports/tests/
            multiplatform/feature/**/build/reports/tests/
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-kmp-debug
          path: multiplatform/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios:
    name: KMP iOS framework
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared iOS UI
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Build iOS simulator app
        run: xcodebuild -project iosApp/QuranApp.xcodeproj -scheme QuranApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

  android-runtime:
    name: KMP Android runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Navigation 3, persistence, children mode and native playback
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          working-directory: multiplatform
          script: bash ../.github/scripts/run-quran-runtime.sh
      - name: Preserve runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-reports
          path: |
            multiplatform/androidApp/build/reports/androidTests/
            multiplatform/androidApp/build/outputs/visual-acceptance/
          if-no-files-found: warn
